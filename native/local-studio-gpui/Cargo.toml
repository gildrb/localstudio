[package]
name = "local-studio-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "79fe6a645f68f8c9230578f154bf99852d9f716f" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "79fe6a645f68f8c9230578f154bf99852d9f716f", features = ["font-kit", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false }
dirs = "6.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
futures = "0.3.34"

[features]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

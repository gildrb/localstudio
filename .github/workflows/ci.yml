name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
        with: { node: "true", install: bun install --frozen-lockfile }
      - run: node scripts/project.mjs validate-contracts
      - run: node scripts/project.mjs validate-structure
  workspace:
    if: github.event_name != 'schedule'
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            install: bun install --frozen-lockfile
            check: bun run check:controller
          - component: agent-runtime
            install: bun install --frozen-lockfile
            check: bun run check:agent-runtime
          - component: frontend
            node: "true"
            install: bun install --frozen-lockfile
            check: bun run check:frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
        with:
          node: ${{ matrix.node || 'false' }}
          install: ${{ matrix.install }}
      - run: ${{ matrix.check }}
  desktop-package:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
        with: { node: "true", install: bun install --frozen-lockfile }
      - name: Build unsigned package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          npm --prefix frontend run desktop:pack --
          --config.mac.identity=null
          --config.mac.hardenedRuntime=false
          --config.extraMetadata.localStudioCommit=${{ github.sha }}
  trufflehog:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: HEAD
          extra_args: --only-verified --json
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939
        with: { languages: "javascript, typescript" }
      - uses: github/codeql-action/autobuild@fddeee1a7ece751b577e409a89057319e3172939
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939
        with: { category: /language:javascript-typescript }
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
